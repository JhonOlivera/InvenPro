<div class="page-header">
  <h2>{{ modoEdicion ? 'Editar categoría' : 'Nueva categoría' }}</h2>
</div>

@if (cargando()) {
  <p class="state-message">Cargando categoría...</p>
} @else {
  <form class="form-card" (ngSubmit)="onSubmit()">
    @if (errores().length > 0) {
      <div class="form-errors">
        <ul>
          @for (mensaje of errores(); track mensaje) {
            <li>{{ mensaje }}</li>
          }
        </ul>
      </div>
    }

    <label class="form-field">
      Nombre
      <input type="text" name="nombre" [(ngModel)]="categoria.nombre" required maxlength="100" />
    </label>

    <label class="form-field">
      Descripción
      <textarea name="descripcion" [(ngModel)]="categoria.descripcion" maxlength="255"></textarea>
    </label>

    <div class="form-actions">
      <button type="submit" class="btn btn--primary" [disabled]="guardando()">
        {{ guardando() ? 'Guardando...' : 'Guardar' }}
      </button>
      <a routerLink="/categorias" class="btn btn--ghost">Cancelar</a>
    </div>
  </form>
}
